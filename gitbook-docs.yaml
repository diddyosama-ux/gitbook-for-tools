$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Tool Setup
  structure:
    - type: section
      key: section-1
      title: Home
      path: home
      icon: house
      default: true
      children:
        - type: space
          key: space-1
          title: Home
          path: home
          default: true
          content:
            directory: ./home
        - type: space
          key: space-6
          title: Landing Page
          path: landing-page
          draft: true
          content:
            directory: ./home/landing-page
    - type: section
      key: section-4
      title: Changelog
      path: changelog
      icon: clock-rotate-left
      children:
        - type: space
          key: space-4
          title: Changelog
          path: changelog
          default: true
          content:
            directory: ./changelog
    - type: section
      key: section-5
      title: Help Center
      path: help-center
      icon: life-ring
      children:
        - type: space
          key: space-5
          title: Help Center
          path: help-center
          default: true
          content:
            directory: ./help-center
